<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#0d1117"/>
  <rect x="0" y="0" width="1200" height="40" fill="#161b22"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#28c840"/>
  <text x="600" y="25" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">Kwirth — Kubernetes Observability Platform</text>
  <rect x="10" y="50" width="180" height="620" fill="#0d1117" rx="4"/>
  <text x="100" y="90" font-family="sans-serif" font-size="11" fill="#f5820a" text-anchor="middle" font-weight="bold">CHANNELS</text>
  <text x="100" y="115" font-family="sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">▶ Log</text>
  <text x="100" y="135" font-family="sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">▶ Metrics</text>
  <text x="100" y="155" font-family="sans-serif" font-size="10" fill="#e3b341" text-anchor="middle">▶ Alerts</text>
  <text x="100" y="175" font-family="sans-serif" font-size="10" fill="#ff7b72" text-anchor="middle">▶ Magnify</text>
  <text x="100" y="195" font-family="sans-serif" font-size="10" fill="#a5d6ff" text-anchor="middle">▶ Pinocchio AI</text>
  <text x="100" y="215" font-family="sans-serif" font-size="10" fill="#7ee787" text-anchor="middle">▶ Trivy</text>
  <rect x="200" y="50" width="990" height="620" fill="#161b22" rx="4"/>
  <text x="695" y="160" font-family="sans-serif" font-size="28" fill="#f0f6fc" text-anchor="middle" font-weight="bold">REPLACE WITH HERO SCREENSHOT</text>
  <text x="695" y="200" font-family="sans-serif" font-size="16" fill="#8b949e" text-anchor="middle">Full Kwirth UI — showing multiple channels active simultaneously</text>
  <text x="695" y="230" font-family="sans-serif" font-size="14" fill="#58a6ff" text-anchor="middle">Suggested: Log + Metrics dashboard view with sidebar visible</text>
  <rect x="230" y="270" width="450" height="280" fill="#0d1117" rx="6" stroke="#30363d" stroke-width="1"/>
  <text x="455" y="300" font-family="monospace" font-size="11" fill="#3fb950" text-anchor="middle">LOG STREAM</text>
  <text x="455" y="325" font-family="monospace" font-size="9" fill="#7ee787" text-anchor="middle">[INFO] Pod started — namespace: production</text>
  <text x="455" y="345" font-family="monospace" font-size="9" fill="#e3b341" text-anchor="middle">[WARN] High memory usage detected</text>
  <text x="455" y="365" font-family="monospace" font-size="9" fill="#3fb950" text-anchor="middle">[INFO] Replica scaled to 3</text>
  <text x="455" y="385" font-family="monospace" font-size="9" fill="#ff7b72" text-anchor="middle">[ERROR] Connection timeout: redis-service</text>
  <rect x="710" y="270" width="450" height="280" fill="#0d1117" rx="6" stroke="#30363d" stroke-width="1"/>
  <text x="935" y="300" font-family="monospace" font-size="11" fill="#f5820a" text-anchor="middle">METRICS</text>
  <text x="935" y="340" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">CPU ████████████░░░░ 72%</text>
  <text x="935" y="365" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">MEM ██████████░░░░░░ 58%</text>
  <text x="935" y="390" font-family="monospace" font-size="9" fill="#3fb950" text-anchor="middle">PODS ████████████████ 100% healthy</text>
  <rect x="200" y="590" width="990" height="4" fill="url(#grad1)" rx="2"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5820a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect x="220" y="620" width="100" height="30" rx="4" fill="#f5820a"/>
  <text x="270" y="641" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Get Started</text>
  <rect x="340" y="620" width="120" height="30" rx="4" fill="transparent" stroke="#f5820a" stroke-width="1"/>
  <text x="400" y="641" font-family="sans-serif" font-size="12" fill="#f5820a" text-anchor="middle">View Docs</text>
