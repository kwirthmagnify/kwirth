  <text x="540" y="475" font-family="monospace" font-size="9" fill="#8b949e">Search: "redis"</text>
  <text x="540" y="498" font-family="monospace" font-size="9" fill="#3fb950">deployment/redis-cache — spec.containers[0].name</text>
  <text x="540" y="516" font-family="monospace" font-size="9" fill="#8b949e">configmap/redis-config — data.REDIS_HOST</text>
  <text x="540" y="534" font-family="monospace" font-size="9" fill="#e3b341">secret/redis-secret — data.password</text>
