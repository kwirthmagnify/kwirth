  <text x="115" y="258" font-family="monospace" font-size="9" fill="#8b949e">▶ Ingresses (5)</text>
  <text x="100" y="282" font-family="monospace" font-size="10" fill="#58a6ff">▼ Config</text>
  <text x="115" y="302" font-family="monospace" font-size="9" fill="#8b949e">▶ ConfigMaps (23)</text>
  <text x="115" y="320" font-family="monospace" font-size="9" fill="#e3b341">▶ Secrets (8)</text>
  <rect x="320" y="80" width="520" height="320" fill="#0d1117" rx="6" stroke="#30363d" stroke-width="1"/>
  <text x="580" y="108" font-family="sans-serif" font-size="11" fill="#f0f6fc" text-anchor="middle" font-weight="bold">Pod Details: api-gateway-7d8f9b-x2k9p</text>
  <text x="360" y="135" font-family="monospace" font-size="9" fill="#58a6ff">spec.containers[0].image</text>
  <text x="360" y="152" font-family="monospace" font-size="9" fill="#3fb950">  myregistry/api-gateway:v2.1.0</text>
  <text x="360" y="175" font-family="monospace" font-size="9" fill="#58a6ff">spec.containers[0].resources.limits</text>
  <text x="360" y="192" font-family="monospace" font-size="9" fill="#8b949e">  cpu: 500m | memory: 512Mi</text>
  <text x="360" y="215" font-family="monospace" font-size="9" fill="#58a6ff">status.phase</text>
  <text x="360" y="232" font-family="monospace" font-size="9" fill="#3fb950">  Running</text>
