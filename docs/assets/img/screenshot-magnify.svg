  <text x="100" y="140" font-family="monospace" font-size="10" fill="#58a6ff">▼ Workloads</text>
  <text x="115" y="160" font-family="monospace" font-size="9" fill="#8b949e">▶ Deployments (12)</text>
  <text x="115" y="178" font-family="monospace" font-size="9" fill="#8b949e">▶ StatefulSets (4)</text>
  <text x="115" y="196" font-family="monospace" font-size="9" fill="#8b949e">▶ Pods (47)</text>
