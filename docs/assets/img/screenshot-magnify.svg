  <circle cx="60" cy="20" r="6" fill="#28c840"/>
  <text x="600" y="25" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">Kwirth Magnify — Kubernetes Explorer (Desktop)</text>
  <text x="600" y="380" font-family="sans-serif" font-size="32" fill="#f0f6fc" text-anchor="middle" font-weight="bold">REPLACE WITH MAGNIFY SCREENSHOT</text>
  <text x="600" y="430" font-family="sans-serif" font-size="16" fill="#8b949e" text-anchor="middle">Show the Magnify channel with file manager tree on the left</text>
  <text x="600" y="460" font-family="sans-serif" font-size="14" fill="#58a6ff" text-anchor="middle">+ multiple floating detail windows open (pod details, artifact search, etc.)</text>
  <text x="600" y="490" font-family="sans-serif" font-size="13" fill="#f5820a" text-anchor="middle">Ideal: Desktop app version showing full-screen Kubernetes explorer</text>
  <rect x="50" y="80" width="250" height="560" fill="#0d1117" rx="6" stroke="#30363d" stroke-width="1"/>
