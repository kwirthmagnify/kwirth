<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490">
  <rect width="900" height="490" fill="#060a12"/>

  <!-- Title -->
  <text x="450" y="34" font-family="sans-serif" font-size="17" fill="#f0f6fc" text-anchor="middle" font-weight="bold">Kwirth Architecture</text>
  <text x="450" y="54" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Single pod deployment — zero external dependencies</text>

  <!-- ── LEFT: Clients (h=60, gap=34, centered in pod y=64-384) ── -->
  <rect x="20" y="100" width="120" height="60" rx="6" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="126" font-family="sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">Browser</text>
  <text x="80" y="144" font-family="sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">React App</text>

  <rect x="20" y="194" width="120" height="60" rx="6" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="220" font-family="sans-serif" font-size="10" fill="#f5820a" text-anchor="middle">Magnify</text>
  <text x="80" y="238" font-family="sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">Desktop App</text>

  <rect x="20" y="288" width="120" height="60" rx="6" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="314" font-family="sans-serif" font-size="10" fill="#2dd4bf" text-anchor="middle">CI/CD Pipeline</text>
  <text x="80" y="332" font-family="sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">REST / WS API</text>

  <!-- Arrows: clients → pod -->
  <line x1="140" y1="130" x2="192" y2="185" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="140" y1="224" x2="192" y2="242" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="140" y1="318" x2="192" y2="315" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── CENTER: Kwirth Pod ── -->
  <rect x="192" y="64" width="450" height="320" rx="10" fill="#0d1117" stroke="#f5820a" stroke-width="2"/>
  <text x="417" y="90" font-family="sans-serif" font-size="13" fill="#f5820a" text-anchor="middle" font-weight="bold">KWIRTH POD</text>
  <text x="417" y="108" font-family="sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">namespace: kwirth (configurable)</text>

  <!-- CORE sub-area -->
  <rect x="205" y="116" width="424" height="94" rx="5" fill="#071d30" stroke="#1e4080" stroke-width="1"/>
  <text x="417" y="132" font-family="sans-serif" font-size="9" fill="#58a6ff" text-anchor="middle" font-weight="bold" letter-spacing="2">CORE</text>
  <rect x="213" y="138" width="198" height="60" rx="4" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="312" y="163" font-family="sans-serif" font-size="9" fill="#f0f6fc" text-anchor="middle">Frontend (React)</text>
  <text x="312" y="181" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">Static SPA · Express</text>
  <rect x="423" y="138" width="198" height="60" rx="4" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="522" y="163" font-family="sans-serif" font-size="9" fill="#f0f6fc" text-anchor="middle">Backend (Node.js)</text>
  <text x="522" y="181" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">Express · WebSocket</text>

  <!-- EXTENSIBILITY sub-area -->
  <rect x="205" y="220" width="424" height="152" rx="5" fill="#0f1208" stroke="#3a4820" stroke-width="1"/>
  <text x="417" y="236" font-family="sans-serif" font-size="9" fill="#f5820a" text-anchor="middle" font-weight="bold" letter-spacing="2">EXTENSIBILITY</text>

  <!-- Left col: Channels/Plugins | Providers -->
  <rect x="213" y="244" width="198" height="48" rx="4" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="312" y="264" font-family="sans-serif" font-size="9" fill="#f0f6fc" text-anchor="middle">Channels / Plugins</text>
  <text x="312" y="280" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">Log · AI · Ops · Fileman…</text>

  <rect x="213" y="302" width="198" height="48" rx="4" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="312" y="322" font-family="sans-serif" font-size="9" fill="#f0f6fc" text-anchor="middle">Providers</text>
  <text x="312" y="338" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">Events · OTel · Kafka · Business</text>

  <!-- Right col: Daemons | Senders -->
  <rect x="423" y="244" width="198" height="48" rx="4" fill="#1a2332" stroke="#f778ba" stroke-width="1"/>
  <text x="522" y="264" font-family="sans-serif" font-size="9" fill="#f778ba" text-anchor="middle">Daemons</text>
  <text x="522" y="280" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">Headless background workers</text>

  <rect x="423" y="302" width="198" height="48" rx="4" fill="#1a2332" stroke="#a371f7" stroke-width="1"/>
  <text x="522" y="322" font-family="sans-serif" font-size="9" fill="#a371f7" text-anchor="middle">Senders</text>
  <text x="522" y="338" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">email · Teams · file · tee · regex…</text>

  <!-- ── RIGHT: K8s Clusters (h=60, gap=34, same grid as left) ── -->
  <line x1="642" y1="175" x2="700" y2="130" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="642" y1="242" x2="700" y2="224" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="642" y1="315" x2="700" y2="318" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="700" y="100" width="155" height="60" rx="6" fill="#1a2332" stroke="#3fb950" stroke-width="1"/>
  <text x="777" y="126" font-family="sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">K8s Cluster 1</text>
  <text x="777" y="144" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">production</text>

  <rect x="700" y="194" width="155" height="60" rx="6" fill="#1a2332" stroke="#3fb950" stroke-width="1"/>
  <text x="777" y="220" font-family="sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">K8s Cluster 2</text>
  <text x="777" y="238" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">staging</text>

  <rect x="700" y="288" width="155" height="60" rx="6" fill="#1a2332" stroke="#3fb950" stroke-width="1"/>
  <text x="777" y="314" font-family="sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">K8s Cluster N</text>
  <text x="777" y="332" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">any environment</text>

  <!-- Notifications (Senders output) -->
  <rect x="700" y="382" width="155" height="60" rx="6" fill="#1a2332" stroke="#a371f7" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="777" y="408" font-family="sans-serif" font-size="10" fill="#a371f7" text-anchor="middle">Notifications</text>
  <text x="777" y="426" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">email · Teams · file · console</text>

  <!-- Arrow: Senders → Notifications -->
  <polyline points="621,326 642,326 700,412" fill="none" stroke="#a371f7" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- ── BOTTOM CENTER: ConfigMaps ── -->
  <line x1="417" y1="384" x2="417" y2="406" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="247" y="406" width="340" height="52" rx="6" fill="#1a2332" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="417" y="428" font-family="sans-serif" font-size="9" fill="#58a6ff" text-anchor="middle">State: Kubernetes ConfigMaps</text>
  <text x="417" y="446" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">Users · API Keys · Plugins · Senders · Providers · Workspaces</text>
</svg>
