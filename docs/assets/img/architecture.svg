<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#060a12"/>
  <text x="450" y="40" font-family="sans-serif" font-size="18" fill="#f0f6fc" text-anchor="middle" font-weight="bold">Kwirth Architecture</text>
  <text x="450" y="65" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Single pod deployment — zero external dependencies</text>
  <!-- Browser clients -->
  <rect x="30" y="100" width="120" height="60" rx="6" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="90" y="127" font-family="sans-serif" font-size="10" fill="#58a6ff" text-anchor="middle">Browser</text>
  <text x="90" y="148" font-family="sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">React App</text>
  <rect x="30" y="200" width="120" height="60" rx="6" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="90" y="227" font-family="sans-serif" font-size="10" fill="#f5820a" text-anchor="middle">Magnify</text>
  <text x="90" y="248" font-family="sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">Desktop App</text>
  <rect x="30" y="300" width="120" height="60" rx="6" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="90" y="327" font-family="sans-serif" font-size="10" fill="#2dd4bf" text-anchor="middle">CI/CD Pipeline</text>
  <text x="90" y="348" font-family="sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">REST / WS API</text>
  <!-- Arrows to Kwirth -->
  <line x1="150" y1="130" x2="270" y2="200" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="150" y1="230" x2="270" y2="240" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="150" y1="330" x2="270" y2="280" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Kwirth Pod -->
  <rect x="270" y="140" width="360" height="240" rx="10" fill="#0d1117" stroke="#f5820a" stroke-width="2"/>
  <text x="450" y="170" font-family="sans-serif" font-size="13" fill="#f5820a" text-anchor="middle" font-weight="bold">KWIRTH POD</text>
  <text x="450" y="190" font-family="sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">namespace: kwirth (configurable)</text>
  <rect x="285" y="205" width="155" height="50" rx="4" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="362" y="227" font-family="sans-serif" font-size="9" fill="#f0f6fc" text-anchor="middle">Frontend (React)</text>
  <text x="362" y="246" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">Static SPA served by Express</text>
  <rect x="460" y="205" width="155" height="50" rx="4" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="537" y="227" font-family="sans-serif" font-size="9" fill="#f0f6fc" text-anchor="middle">Backend (Node.js)</text>
  <text x="537" y="246" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">Express + WebSocket</text>
  <rect x="285" y="270" width="155" height="50" rx="4" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="362" y="292" font-family="sans-serif" font-size="9" fill="#f0f6fc" text-anchor="middle">Channels</text>
  <text x="362" y="308" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">Log·Metrics·Alerts·Magnify…</text>
  <rect x="460" y="270" width="155" height="50" rx="4" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="537" y="292" font-family="sans-serif" font-size="9" fill="#f0f6fc" text-anchor="middle">Providers / Plugins</text>
  <text x="537" y="308" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">Extensible · Hot-reload</text>
  <!-- Arrows to k8s clusters -->
  <line x1="630" y1="200" x2="720" y2="160" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="630" y1="240" x2="720" y2="260" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="630" y1="280" x2="720" y2="360" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Kubernetes clusters -->
  <rect x="720" y="100" width="155" height="70" rx="6" fill="#1a2332" stroke="#3fb950" stroke-width="1"/>
  <text x="797" y="130" font-family="sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">K8s Cluster 1</text>
  <text x="797" y="150" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">production</text>
  <rect x="720" y="210" width="155" height="70" rx="6" fill="#1a2332" stroke="#3fb950" stroke-width="1"/>
  <text x="797" y="240" font-family="sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">K8s Cluster 2</text>
  <text x="797" y="260" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">staging</text>
  <rect x="720" y="320" width="155" height="70" rx="6" fill="#1a2332" stroke="#3fb950" stroke-width="1"/>
  <text x="797" y="350" font-family="sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">K8s Cluster N</text>
  <text x="797" y="370" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">any environment</text>
  <!-- ConfigMap storage -->
  <rect x="320" y="420" width="260" height="50" rx="6" fill="#1a2332" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="450" y="442" font-family="sans-serif" font-size="9" fill="#58a6ff" text-anchor="middle">State: Kubernetes ConfigMaps</text>
  <text x="450" y="460" font-family="sans-serif" font-size="8" fill="#8b949e" text-anchor="middle">Users · API Keys · Workspaces · Plugins · Providers</text>
  <line x1="450" y1="380" x2="450" y2="420" stroke="#58a6ff" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
