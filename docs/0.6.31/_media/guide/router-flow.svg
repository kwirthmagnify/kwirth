<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="960" height="290" role="img" aria-label="Traffic for a routed cluster goes to your own Kwirth, which authenticates it and hands it to the router, which carries it to the other cluster">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="290" rx="12" fill="#0d1420"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <path d="M145,80 C145,22 825,22 825,80" fill="none" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="6 6" opacity=".7"/>
    <circle cx="485" cy="37" r="10" fill="#0d1420" stroke="#ff7b72" stroke-width="1.5"/>
    <path d="M480,32 L490,42 M490,32 L480,42" stroke="#ff7b72" stroke-width="2"/>
    <text x="485" y="18" font-size="12" fill="#ff7b72">no direct path</text>

    <rect x="20" y="80" width="250" height="160" rx="10" fill="#0f1929" stroke="#1e2d40"/>
    <text x="145" y="112" font-size="14" font-weight="700" fill="#e6edf3">Your browser</text>
    <text x="145" y="132" font-size="12" fill="#8b949e">or your Kwirth's back end</text>
    <text x="145" y="170" font-size="13" fill="#2dd4bf">cluster-list entry</text>
    <text x="145" y="192" font-size="12" fill="#8b949e">its real URL</text>
    <text x="145" y="212" font-size="12" fill="#8b949e">+ route: router · cluster uid</text>

    <line x1="272" y1="160" x2="352" y2="160" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="312" y="148" font-size="11" fill="#8b949e">requests</text>
    <text x="312" y="180" font-size="11" fill="#8b949e">WebSockets</text>

    <rect x="355" y="60" width="270" height="210" rx="10" fill="#0f1929" stroke="#2dd4bf" stroke-opacity=".45"/>
    <text x="490" y="88" font-size="14" font-weight="700" fill="#e6edf3">Your Kwirth</text>
    <text x="490" y="108" font-size="12" fill="#58a6ff" font-family="'JetBrains Mono', 'Fira Code', monospace">/router/&lt;id&gt;/…</text>
    <rect x="375" y="122" width="230" height="50" rx="8" fill="#111827" stroke="#1e2d40"/>
    <text x="490" y="143" font-size="13" fill="#e6edf3">1 · <tspan fill="#58a6ff" font-weight="700">authenticates</tspan> it</text>
    <text x="490" y="161" font-size="11" fill="#8b949e">ticket · loopback · access key</text>
    <rect x="375" y="186" width="230" height="64" rx="8" fill="#2dd4bf" fill-opacity=".08" stroke="#2dd4bf"/>
    <text x="490" y="211" font-size="13" fill="#e6edf3">2 · hands it to the <tspan fill="#2dd4bf" font-weight="700">router</tspan></text>
    <text x="490" y="232" font-size="11" fill="#8b949e">with who is calling</text>

    <line x1="607" y1="218" x2="707" y2="200" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow-teal)"/>
    <text x="660" y="190" font-size="11" fill="#8b949e">its own way</text>
    <text x="655" y="240" font-size="11" fill="#8b949e">tunnel · bastion</text>

    <rect x="710" y="80" width="230" height="160" rx="10" fill="#0f1929" stroke="#1e2d40"/>
    <text x="825" y="122" font-size="14" font-weight="700" fill="#e6edf3">The other cluster</text>
    <text x="825" y="160" font-size="12" fill="#8b949e">a Kwirth behind NAT,</text>
    <text x="825" y="180" font-size="12" fill="#8b949e">a firewall or a DMZ</text>
    <text x="825" y="214" font-size="12" fill="#e6edf3">authorizes with its own key</text>
  </g>
</svg>
