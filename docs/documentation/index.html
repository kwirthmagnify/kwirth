    .markdown-section h2 { margin-bottom: -10px }

</head>
<body>
  <a class="back-link" href="/">&#8592; kwirthmagnify.dev</a>
  <div id="app"></div>
  <script>
    window.$docsify = {
      auto2top: true,
      relativePath: true,
      coverpage: true,
      loadSidebar: true,
      basePath: '../',
      logo: '/_media/kwirth-last.ico',
      name: 'Kwirth Observability Stack',
      homepage: 'index.md',
      subMaxLevel: 2,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search...',
        noData: 'No Results!',
        depth: 6,
        hideOtherSidebarContent: false
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
