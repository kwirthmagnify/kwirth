<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kwirth Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Kwirth documentation — Kubernetes observability platform">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="icon" type="image/x-icon" href="/kwirth/_media/favicon.ico">
  <style>
    .markdown-section h2 { margin-bottom: -10px }
    .markdown-section h3 { margin-bottom: -10px }
    h5 { margin-bottom: -15px }
    .imageclass100 { display: block; margin: 0 auto; border-color: #34495e; border-style: solid; border-width: 1px; margin-top: 12px; margin-bottom: 4px; }
    .imageclass90 { display: block; width: 90%; margin: 0 auto; border-radius: 1%; border-color: #34495e; border-style: solid; border-width: 1px }
    .imageclass80 { display: block; width: 80%; margin: 0 auto; border-radius: 1%; border-color: #34495e; border-style: solid; border-width: 1px }
    .imageclass60 { display: block; width: 60%; margin: 0 auto; border-radius: 1%; border-color: #34495e; border-style: solid; border-width: 1px }
    .imageclass40 { display: block; width: 40%; margin: 0 auto; border-radius: 1%; border-color: #34495e; border-style: solid; border-width: 1px }
    .imageclass20 { display: block; width: 20%; margin: 0 auto; border-radius: 1%; border-color: #34495e; border-style: solid; border-width: 1px }
    .imageclass10 { display: block; width: 10%; margin: 0 auto; border-radius: 1%; border-color: #34495e; border-style: solid; border-width: 1px }
    .imageclassCenter { display: block; width: 60%; margin: 0 auto; align-self: center; border-radius: 1%; border-color: #34495e; border-style: solid; border-width: 1px }
    .back-link { position: fixed; top: 12px; right: 20px; z-index: 9999; background: #f5820a; color: white; padding: 6px 14px; border-radius: 4px; text-decoration: none; font-size: 13px; font-family: sans-serif; }
    .back-link:hover { background: #d4700a; }
    select { padding: 8px 12px; font-size: 14px; border:0; outline: none; transition: all 0.3s ease; border-bottom: 2px solid #42b983; }
    select:hover { background-color: #ddd; }
    option { background-color: #2e2e2e; color: white; }
    option:hover { background-color: #444; }
  </style>
</head>
<body style="background-color: white">
  <a class="back-link" href="/">&#8592; kwirthmagnify.dev</a>
  <div id="app"></div>
  <script>
    window.$docsify = {
      auto2top: true,
      relativePath: true,
      coverpage: true,
      loadSidebar: true,
      basePath: '../',
      logo: '/_media/kwirth-logo-20.png',
      name: 'Kwirth Observability Stack',
      homepage: 'index.md',
      subMaxLevel: 2,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search...',
        noData: 'No Results!',
        depth: 6,
        hideOtherSidebarContent: false
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

</html>
