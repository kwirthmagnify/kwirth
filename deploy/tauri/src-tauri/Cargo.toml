[package]
name = "kwirth-magnify"
version = "0.6.91"
edition = "2021"

[lib]
name = "kwirth_magnify_lib"
# Only rlib: the binary links it. staticlib and cdylib are the template's, for iOS and Android, and with
# LTO each of them was one more whole-program link on every build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
# thin and parallel, not fat with one codegen unit: this app only starts the backend and opens a window,
# and fat LTO in a single thread made each build cost more than ten minutes for nothing measurable
lto = "thin"
panic = "abort"
strip = true
