apiVersion: v1
kind: Namespace
metadata:
  name: kwirth
---
apiVersion: v1
kind: Secret
metadata:
  name: kwirth-users
  namespace: kwirth
# The bootstrap admin, as the core stores users: base64url of the id for the key, and base64 of the user
# JSON for the value. First login is admin / password, and Kwirth answers "change it" instead of letting
# you in until you do.
#
# 🔴 The password inside is a bcrypt hash, not the clear text it used to be. The login compares bcrypt
# against the SHA-256 the browser sends — it never sees the clear text — and the branch that accepted a
# plain stored value is gone. Decoded, this is:
#   {"id":"admin","name":"Nicklaus Wirth","password":"$2b$10$...","resources":"cluster,admin::::"}
#
# Want a different starting password? Do not edit this by hand: install, log in, change it in the UI.
data:
  YWRtaW4: 'eyJpZCI6ImFkbWluIiwibmFtZSI6Ik5pY2tsYXVzIFdpcnRoIiwicGFzc3dvcmQiOiIkMmIkMTAkd3ZLZmN1dWg3NmV3OWlVV0N3MVh3dTh5UC9WbmhUUUpQWXNrZ2lqNmc5OTlyQTAzOTRETmUiLCJyZXNvdXJjZXMiOiJjbHVzdGVyLGFkbWluOjo6OiJ9'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kwirth-sa
  namespace: kwirth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kwirth-cr
  namespace: kwirth
rules:
  # "" indicates the core API group
  # 'batch' is indispensable: without it, listing jobs gives a 403 and the resource selector is left with
  # NO controller at all — neither deployments nor statefulsets — because the six listings go together.
  # 'node.k8s.io', 'scheduling.k8s.io' and 'admissionregistration.k8s.io' are listed by the Magnify
  # browser too; without them those three branches of the tree answered 403 without saying so.
  #
  # This is a broad grant — it is create and delete on every Secret in the cluster, plus exec. If you
  # want Kwirth to observe and never to act, kwirth-full-ro.yaml in this same folder is the same
  # deployment with no write permission at all, and it loses no observability for it.
  - apiGroups: ['', 'apps', 'batch', 'autoscaling', 'policy', 'coordination.k8s.io', 'metrics.k8s.io', 'rbac.authorization.k8s.io', 'networking.k8s.io', 'storage.k8s.io', 'node.k8s.io', 'scheduling.k8s.io', 'admissionregistration.k8s.io', 'apiextensions.k8s.io', 'aquasecurity.github.io']
    resources: ['*']
    verbs: ['*']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kwirth-crb
  namespace: kwirth
subjects:
- kind: ServiceAccount
  name: kwirth-sa
  namespace : kwirth
roleRef:
  kind: ClusterRole
  name: kwirth-cr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwirth
  namespace: kwirth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kwirth
  revisionHistoryLimit: 0
  template:
    metadata:
      name: kwirth
      labels:
        app: kwirth
    spec:
      serviceAccount: kwirth-sa
      terminationGracePeriodSeconds: 5
      containers:
        - name: kwirth
          image: kwirthmagnify/kwirth:latest
          #imagePullPolicy: Never
          env:
            - name: ROOTPATH
              value: '/kwirth'
            # MASTERKEY intentionally unset: the core generates a random one on first boot and persists it
            # (here, a ConfigMap in this namespace) so no two installations share a key — the old hardcoded
            # 'Kwirth4Ever' let anyone forge an admin token. To pin it yourself, set it from a Secret:
            #   - name: MASTERKEY
            #     valueFrom: { secretKeyRef: { name: kwirth-masterkey, key: MASTERKEY } }
            # The only two channel switches the back reads. LOG, ALERT, OPS, TRIVY and ECHO used to be
            # listed here and did nothing: those channels are plugins now, and a plugin is turned off
            # by not installing it.
            - name: CHANNEL_METRICS
              value: 'true'
            - name: CHANNEL_MAGNIFY
              value: 'true'
          ports:
            - name: kwirth
              containerPort: 3883
              protocol: TCP
          resources:
            limits:
              cpu: '1'
              memory: 2Gi
            requests:
              cpu: 0m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3883
            initialDelaySeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: 3883
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3883
            timeoutSeconds: 30
            periodSeconds: 60
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: kwirth-svc
  namespace: kwirth
spec:
  selector:
    app: kwirth
  ports:
    - name: kwirth-port
      protocol: TCP
      port: 3883
      targetPort: 3883
  type: ClusterIP
