# ===================================================================================================
# Kwirth — single-file deployment with NO write permission at all
# ===================================================================================================
#
#   kubectl apply -f kwirth-full-ro.yaml
#
# Two manifests live in this folder:
#
#   kwirth.yaml            apiGroups:['*'] resources:['*'] verbs:['*']   store: etcd
#   kwirth-full-ro.yaml    get / list / watch. Nothing else, anywhere   store: a PVC
#
# WHAT 'FULL' MEANS HERE
#   One rule, three verbs: get, list, watch. The ServiceAccount has exactly one binding and that is
#   the whole of its authority in the cluster — there is no namespaced Role either. The filter is the
#   VERBS, not the resources, and that is what makes it safe: opening a shell is 'create' on
#   pods/exec and evicting is 'create' on pods/eviction, so both are denied, as are delete, patch,
#   update and escalate.
#
#   And it loses nothing for it. Metrics included: Kwirth reads the ServiceAccount token that
#   Kubernetes already projects into every pod and that the KUBELET ROTATES, so reaching the kubelet
#   costs no permission at all. Earlier builds asked the API server for a token instead, which meant
#   a 'create' on serviceaccounts/token — and a token that expired in a week and was never renewed.
#
#   🔴 That needs Kwirth 0.6.65 or later. On an older image there is no projected-token path: the
#   TokenRequest is refused by this role, the back says "There is no SA Token, no metrics will be
#   available" at startup and carries on without them. Everything else works the same.
#
# WHAT IT CANNOT DO, BY DESIGN
#   Restart / scale / cordon / drain / evict / apply / delete anything, and open a shell into a pod.
#   That is the Magnify channel's command half and the 'ops' and 'fileman' plugins: the UI still
#   offers the action and the API server answers 403. If you do not want the dead buttons, do not
#   install those plugins.
#
# 🔴 THE PRICE, SAID PLAINLY: SECRETS ARE READABLE
#   'resources: [*]' includes Secrets, and RBAC cannot subtract — there are no deny rules and no way
#   to say "every group except the core one". So whoever reaches Kwirth's admin can read every
#   Secret in the cluster. Worth weighing against two facts: under either manifest Kwirth already
#   reads every pod's log and every ConfigMap cluster-wide, and what kwirth.yaml grants is read AND
#   WRITE on all of it, plus exec and delete.
#
#   Spelling out resources instead was tried and does not survive contact with a real cluster. The
#   events provider opens a watcher for every CustomResourceDefinition it sees appear
#   (EventsProvider, handleEvent -> startCrdInstanceWatcher), nobody has to ask it to, and which
#   CRDs a cluster has cannot be known when the manifest is written. On a stock k3d with Rancher and
#   Kubewarden installed, an enumerated role produced 37 Forbidden watchers at every boot, each with
#   six retries, and lost those events in silence. If your requirement is that Secrets stay
#   unreadable, use the enumerated block at the bottom of this header and accept that loss.
#
# WHY THE PVC IS PART OF THE SECURITY STORY, NOT A DETAIL
#   Inside Kubernetes, Kwirth's store is normally ConfigMaps and Secrets of its own namespace: users,
#   api keys, installed extensions, marketplaces. That forces WRITE permission on Secrets. Pointing
#   KWIRTH_STORE at a mounted volume moves all of it to the PVC, AES-256-GCM encrypted with
#   MASTERKEY, and the write disappears with it.
#
# 🔴 MASTERKEY: GENERATED ON FIRST BOOT, THEN NEVER CHANGED
#   It is the key the store is encrypted with and the one that signs api keys. This manifest leaves it
#   UNSET: the core generates a random one on the first boot and persists it on the PVC, so every
#   installation gets its own (the old hardcoded default let anyone forge an admin token). It survives
#   restarts with the volume. Change it later and nothing errors, but the files stop decrypting, Kwirth
#   sees no users and recreates the default admin — so don't. For at-rest encryption that also resists
#   someone reading the volume, set MASTERKEY from a Secret kept outside the PVC (see the env section).
#
# BEFORE YOU APPLY IT
#   - check that the cluster has a default StorageClass, or name one in the PVC
#   - the first boot creates the admin user as admin / password. Change it at once.
#
# ---------------------------------------------------------------------------------------------------
# STRICT ALTERNATIVE: enumerated, Secrets unreadable, no events from CRDs
# ---------------------------------------------------------------------------------------------------
# Drop-in replacement for the 'rules:' of the ClusterRole below. It is kept correct by the unit
# tests, which derive what the back calls from back/src and check this list covers it — including
# the subresources, which are the part that bites: the metrics provider reads TWO kubelet paths per
# node and the kubelet authorizes them against DIFFERENT subresources, /metrics/cadvisor against
# nodes/metrics and /stats/summary against nodes/stats. Missing the second one does not degrade node
# metrics, it breaks them.
#
# STRICT-RULES-BEGIN
#   - apiGroups: ['']
#     resources: ['componentstatuses', 'configmaps', 'endpoints', 'events', 'limitranges', 'namespaces', 'nodes', 'persistentvolumeclaims', 'persistentvolumes', 'pods', 'replicationcontrollers', 'resourcequotas', 'services']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['']
#     resources: ['pods/log', 'pods/status']
#     verbs: ['get', 'list']
#   - apiGroups: ['']
#     resources: ['nodes/metrics', 'nodes/stats']
#     verbs: ['get']
#   - apiGroups: ['apps']
#     resources: ['daemonsets', 'deployments', 'replicasets', 'statefulsets']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['batch']
#     resources: ['cronjobs', 'jobs']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['autoscaling']
#     resources: ['horizontalpodautoscalers']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['policy']
#     resources: ['poddisruptionbudgets']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['coordination.k8s.io']
#     resources: ['leases']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['networking.k8s.io']
#     resources: ['ingresses', 'ingressclasses', 'networkpolicies']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['storage.k8s.io']
#     resources: ['csidrivers', 'csinodes', 'csistoragecapacities', 'storageclasses', 'volumeattachments']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['node.k8s.io']
#     resources: ['runtimeclasses']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['scheduling.k8s.io']
#     resources: ['priorityclasses']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['admissionregistration.k8s.io']
#     resources: ['mutatingwebhookconfigurations', 'validatingwebhookconfigurations']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['apiextensions.k8s.io']
#     resources: ['customresourcedefinitions']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['rbac.authorization.k8s.io']
#     resources: ['clusterroles', 'clusterrolebindings', 'roles', 'rolebindings']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['metrics.k8s.io']
#     resources: ['pods', 'nodes']
#     verbs: ['get', 'list']
# STRICT-RULES-END
#
# Add, per CRD group whose events you want, and repeat for every cluster you deploy to:
#
#   - apiGroups: ['aquasecurity.github.io']
#     resources: ['*']
#     verbs: ['get', 'list', 'watch']
# ===================================================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: kwirth

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kwirth-sa
  namespace: kwirth

---
# ===================================================================================================
# The only authority this deployment has
# ===================================================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kwirth-full-ro-cr
rules:
  # Read everything, change nothing. See the header for what this does and does not allow, and for
  # the enumerated alternative that keeps Secrets unreadable at the cost of CRD events.
  - apiGroups: ['*']
    resources: ['*']
    verbs: ['get', 'list', 'watch']

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kwirth-full-ro-crb
subjects:
  - kind: ServiceAccount
    name: kwirth-sa
    namespace: kwirth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kwirth-full-ro-cr

---
# There is no Role and no RoleBinding in this file, and that is the point. Everything Kwirth would
# have kept in Secrets and ConfigMaps lives here instead, encrypted with MASTERKEY. Delete this and
# you delete the users, the api keys and the installed extensions.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kwirth-store
  namespace: kwirth
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # uses the cluster's default StorageClass; name one here if there is no default
  #storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwirth
  namespace: kwirth
spec:
  # ReadWriteOnce, and the store is a directory of files with no locking: one replica.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: with ReadWriteOnce the new pod cannot mount the volume while the
    # old one still holds it, and the rollout would sit there until it gave up.
    type: Recreate
  selector:
    matchLabels:
      app: kwirth
  revisionHistoryLimit: 0
  template:
    metadata:
      name: kwirth
      labels:
        app: kwirth
    spec:
      serviceAccountName: kwirth-sa
      # automountServiceAccountToken is left at its default of true ON PURPOSE: that projected token
      # is how the metrics provider reaches the kubelet without this deployment needing a single
      # write. Turning it off costs you the metrics.
      terminationGracePeriodSeconds: 5
      containers:
        - name: kwirth
          image: kwirthmagnify/kwirth:latest
          #imagePullPolicy: Never
          # Least privilege is not only RBAC. Kwirth needs no capability, no privilege escalation and
          # no writable image: the store is the PVC, and everything else it writes at runtime
          # (extension tarballs, docs, AI toolsets) goes to os.tmpdir(), the emptyDir below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
            seccompProfile:
              type: RuntimeDefault
            # The image does not declare a USER, so it starts as root. Running it as the 'node' user
            # of the base image works, but verify it on your cluster before turning it on — and give
            # the PVC an fsGroup so the mounted volume stays writable.
            #runAsNonRoot: true
            #runAsUser: 1000
          env:
            - name: ROOTPATH
              value: '/kwirth'
            # MASTERKEY is intentionally NOT set here. Left unset, the core generates a random one on the
            # first boot and persists it next to the store on the PVC below, so no two installations share
            # a key (the old hardcoded 'Kwirth4Ever' let anyone forge an admin token). It survives restarts
            # with the volume. NOTE: a key that lives on the same volume as the encrypted store does not
            # protect that store against someone who can read the volume — for real at-rest encryption,
            # set MASTERKEY from a Secret kept OUTSIDE this volume:
            #   - name: MASTERKEY
            #     valueFrom: { secretKeyRef: { name: kwirth-masterkey, key: MASTERKEY } }
            # This is what moves the store off the cluster and onto the volume. Any value other than
            # 'etcd' means "encrypted files at this path".
            - name: KWIRTH_STORE
              value: '/data'
            # On a crash Kwirth appends the post-mortem to a 'kwirth-secure-log' ConfigMap, which
            # this role does not allow. Off here; the crash still goes to the pod log, which is
            # where 'kubectl logs --previous' looks anyway.
            - name: EXITLOG
              value: 'false'
            # The only two channel switches the back reads. The channels that used to be listed in
            # kwirth.yaml (LOG, ALERT, OPS, TRIVY, ECHO) are plugins now and those variables did
            # nothing.
            - name: CHANNEL_METRICS
              value: 'true'
            - name: CHANNEL_MAGNIFY
              value: 'true'
          ports:
            - name: kwirth
              containerPort: 3883
              protocol: TCP
          volumeMounts:
            - name: store
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: '1'
              memory: 2Gi
            requests:
              cpu: 0m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3883
            initialDelaySeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: 3883
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3883
            timeoutSeconds: 30
            periodSeconds: 60
            successThreshold: 1
            failureThreshold: 3
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: kwirth-store
        # Scratch space. Everything Kwirth writes at runtime that is not the store lands here, which
        # is what lets the root filesystem be read-only. Raise sizeLimit for big guides or packs.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: kwirth-svc
  namespace: kwirth
spec:
  selector:
    app: kwirth
  ports:
    - name: kwirth-port
      protocol: TCP
      port: 3883
      targetPort: 3883
  type: ClusterIP

