# ===================================================================================================
# Kwirth — single-file deployment with NO write permission at all
# ===================================================================================================
#
#   kubectl apply -f kwirth-full-ro.yaml
#
# Three manifests live in this folder, and this is the strictest of them:
#
#   kwirth.yaml            apiGroups:['*'] resources:['*'] verbs:['*']   store: etcd
#   kwirth-readonly.yaml   read-only, + ONE create: a token for its own ServiceAccount
#   kwirth-full-ro.yaml    read-only. Nothing else. No Role, no RoleBinding, no create anywhere
#
# WHAT 'FULL' MEANS HERE
#   One rule, three verbs: get, list, watch. The ServiceAccount has exactly one binding and that is
#   the whole of its authority in the cluster. The filter is the VERBS, not the resources, and that
#   is what makes it safe: opening a shell is 'create' on pods/exec and evicting is 'create' on
#   pods/eviction, so both are denied, as are delete, patch, update and escalate.
#
#   Getting here takes two things. The store moves to a PVC (KWIRTH_STORE), so Kwirth's own
#   configuration stops being Secrets it has to write. And the metrics provider is turned off, which
#   is what removes the last create.
#
# 🔴 WHAT YOU GIVE UP: THE KUBELET METRICS
#   The metrics provider scrapes each node's kubelet directly, and it authenticates with a token
#   Kwirth mints for its own ServiceAccount — a 'create' on serviceaccounts/token, the one verb this
#   file does not have. Without it the back says so at startup and carries on:
#
#       There is no SA Token, no metrics will be available.
#
#   Startup does not fail. What loses its feed is the metrics provider and its six consumers: the
#   'metrics' and 'magnify' channels, and the alert, pinocchio, spectrum and agora plugins. If you
#   use alerts on CPU or memory, this is the manifest that takes them away.
#
#   CHANNEL_METRICS is therefore set to 'false' below. The channel would otherwise be offered in the
#   UI with nothing behind it.
#
#   ⚠️ IT WILL LOG. That switch turns off the CHANNEL, not the PROVIDER, and the provider keeps its
#   own 15-second clock, so the pod log gets one line per node per tick, for ever:
#
#       Error reading metrics from 'https://<nodeIp>:10250/metrics/cadvisor' 401: Unauthorized
#
#   Nothing is broken — that 401 is the kubelet declining a request with no token, which is this
#   manifest working as designed — but on a big cluster it is a lot of noise. Today the only way to
#   silence it is to give Kwirth the token, which means kwirth-readonly.yaml. Making the back skip
#   the metrics clock when there is no token is a one-line change that has not been made yet.
#
# WHAT STILL WORKS
#   Logs, events, the whole resource browser, the resource selector, and every channel that only
#   reads. Including, and this surprises people: the PodMetrics and NodeMetrics entries of the
#   Magnify tree. Those do not go to the kubelet — they are metrics.k8s.io read through the API
#   server with the ordinary client, no token involved.
#
# 🔴 THE PRICE, SAID PLAINLY: SECRETS ARE READABLE
#   'resources: [*]' includes Secrets, and RBAC cannot subtract — there are no deny rules and no way
#   to say "every group except the core one". So whoever reaches Kwirth's admin can read every
#   Secret in the cluster. Worth weighing against two facts: under any of these manifests Kwirth
#   already reads every pod's log and every ConfigMap cluster-wide, and what kwirth.yaml grants
#   today is read AND WRITE on all of it, plus exec and delete.
#
#   Spelling out resources instead was tried and does not survive contact with a real cluster. The
#   events provider opens a watcher for every CustomResourceDefinition it sees appear
#   (EventsProvider, handleEvent -> startCrdInstanceWatcher), nobody has to ask it to, and which
#   CRDs a cluster has cannot be known when the manifest is written. On a stock k3d with Rancher and
#   Kubewarden installed, an enumerated role produced 37 Forbidden watchers at every boot, each with
#   six retries, and lost those events in silence. If your requirement is that Secrets stay
#   unreadable, use the enumerated block at the bottom of this header and accept that loss.
#
# 🔴 MASTERKEY IS SET ONCE, BEFORE THE FIRST BOOT, AND NEVER CHANGED
#   It is the key the store is encrypted with. Change it later and nothing errors: the files stop
#   decrypting, Kwirth sees no users, and it recreates the default admin — the password resets to
#   'password' and every api key and extension setting is gone. Change it now, not afterwards.
#
# IF YOU WANT THE METRICS BACK
#   Use kwirth-readonly.yaml, which is this same file plus a Role with a single rule, scoped by name
#   so Kwirth can mint a token for itself and for nothing else.
#
# BEFORE YOU APPLY IT
#   - change MASTERKEY
#   - check that the cluster has a default StorageClass, or name one in the PVC
#   - the first boot creates the admin user as admin / password. Change it at once.
#
# ---------------------------------------------------------------------------------------------------
# STRICT ALTERNATIVE: enumerated, Secrets unreadable, no events from CRDs
# ---------------------------------------------------------------------------------------------------
# Drop-in replacement for the 'rules:' of the ClusterRole below. It is kept correct by the unit
# tests, which derive what the back calls from back/src and check this list covers it. It does NOT
# include nodes/metrics or nodes/stats: those are kubelet paths, and reaching the kubelet needs the
# token this manifest cannot mint, so granting them would be permission for a call that never
# happens.
#
# STRICT-RULES-BEGIN
#   - apiGroups: ['']
#     resources: ['componentstatuses', 'configmaps', 'endpoints', 'events', 'limitranges', 'namespaces', 'nodes', 'persistentvolumeclaims', 'persistentvolumes', 'pods', 'replicationcontrollers', 'resourcequotas', 'services']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['']
#     resources: ['pods/log', 'pods/status']
#     verbs: ['get', 'list']
#   - apiGroups: ['apps']
#     resources: ['daemonsets', 'deployments', 'replicasets', 'statefulsets']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['batch']
#     resources: ['cronjobs', 'jobs']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['autoscaling']
#     resources: ['horizontalpodautoscalers']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['policy']
#     resources: ['poddisruptionbudgets']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['coordination.k8s.io']
#     resources: ['leases']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['networking.k8s.io']
#     resources: ['ingresses', 'ingressclasses', 'networkpolicies']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['storage.k8s.io']
#     resources: ['csidrivers', 'csinodes', 'csistoragecapacities', 'storageclasses', 'volumeattachments']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['node.k8s.io']
#     resources: ['runtimeclasses']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['scheduling.k8s.io']
#     resources: ['priorityclasses']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['admissionregistration.k8s.io']
#     resources: ['mutatingwebhookconfigurations', 'validatingwebhookconfigurations']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['apiextensions.k8s.io']
#     resources: ['customresourcedefinitions']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['rbac.authorization.k8s.io']
#     resources: ['clusterroles', 'clusterrolebindings', 'roles', 'rolebindings']
#     verbs: ['get', 'list', 'watch']
#   - apiGroups: ['metrics.k8s.io']
#     resources: ['pods', 'nodes']
#     verbs: ['get', 'list']
# STRICT-RULES-END
#
# Add, per CRD group whose events you want, and repeat for every cluster you deploy to:
#
#   - apiGroups: ['aquasecurity.github.io']
#     resources: ['*']
#     verbs: ['get', 'list', 'watch']
# ===================================================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: kwirth

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kwirth-sa
  namespace: kwirth

---
# ===================================================================================================
# The only authority this deployment has
# ===================================================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kwirth-full-ro-cr
rules:
  # Read everything, change nothing. See the header for what this does and does not allow, and for
  # the enumerated alternative that keeps Secrets unreadable at the cost of CRD events.
  - apiGroups: ['*']
    resources: ['*']
    verbs: ['get', 'list', 'watch']

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kwirth-full-ro-crb
subjects:
  - kind: ServiceAccount
    name: kwirth-sa
    namespace: kwirth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kwirth-full-ro-cr

---
# There is no Role and no RoleBinding in this file, and that is the point. Everything Kwirth would
# have kept in Secrets and ConfigMaps lives here instead, encrypted with MASTERKEY. Delete this and
# you delete the users, the api keys and the installed extensions.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kwirth-store
  namespace: kwirth
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # uses the cluster's default StorageClass; name one here if there is no default
  #storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwirth
  namespace: kwirth
spec:
  # ReadWriteOnce, and the store is a directory of files with no locking: one replica.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: with ReadWriteOnce the new pod cannot mount the volume while the
    # old one still holds it, and the rollout would sit there until it gave up.
    type: Recreate
  selector:
    matchLabels:
      app: kwirth
  revisionHistoryLimit: 0
  template:
    metadata:
      name: kwirth
      labels:
        app: kwirth
    spec:
      serviceAccountName: kwirth-sa
      terminationGracePeriodSeconds: 5
      containers:
        - name: kwirth
          image: kwirthmagnify/kwirth:latest
          #imagePullPolicy: Never
          # Least privilege is not only RBAC. Kwirth needs no capability, no privilege escalation and
          # no writable image: the store is the PVC, and everything else it writes at runtime
          # (extension tarballs, docs, AI toolsets) goes to os.tmpdir(), the emptyDir below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
            seccompProfile:
              type: RuntimeDefault
            # The image does not declare a USER, so it starts as root. Running it as the 'node' user
            # of the base image works, but verify it on your cluster before turning it on — and give
            # the PVC an fsGroup so the mounted volume stays writable.
            #runAsNonRoot: true
            #runAsUser: 1000
          env:
            - name: ROOTPATH
              value: '/kwirth'
            # 🔴 Change this, once, before the first boot. See the header.
            - name: MASTERKEY
              value: 'Kwirth4Ever'
            # This is what moves the store off the cluster and onto the volume. Any value other than
            # 'etcd' means "encrypted files at this path".
            - name: KWIRTH_STORE
              value: '/data'
            # On a crash Kwirth appends the post-mortem to a 'kwirth-secure-log' ConfigMap, which
            # this role does not allow — and the failed write makes it wait an hour before exiting
            # instead of letting the Deployment restart it. Off here; the crash still goes to the
            # pod log, which is where kubectl logs --previous looks anyway.
            - name: EXITLOG
              value: 'false'
            # Off: without a ServiceAccount token the provider cannot reach any kubelet, so the
            # channel would be offered with nothing behind it. This is the line to flip, together
            # with moving to kwirth-readonly.yaml, if you decide you want the metrics after all.
            - name: CHANNEL_METRICS
              value: 'false'
            # Magnify stays on. It subscribes to the metrics provider too, so its metric-fed parts
            # come up empty, but browsing the cluster — which is most of what it is for — works.
            - name: CHANNEL_MAGNIFY
              value: 'true'
          ports:
            - name: kwirth
              containerPort: 3883
              protocol: TCP
          volumeMounts:
            - name: store
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: '1'
              memory: 2Gi
            requests:
              cpu: 0m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3883
            initialDelaySeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: 3883
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3883
            timeoutSeconds: 30
            periodSeconds: 60
            successThreshold: 1
            failureThreshold: 3
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: kwirth-store
        # Scratch space. Everything Kwirth writes at runtime that is not the store lands here, which
        # is what lets the root filesystem be read-only. Raise sizeLimit for big guides or packs.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: kwirth-svc
  namespace: kwirth
spec:
  selector:
    app: kwirth
  ports:
    - name: kwirth-port
      protocol: TCP
      port: 3883
      targetPort: 3883
  type: ClusterIP

