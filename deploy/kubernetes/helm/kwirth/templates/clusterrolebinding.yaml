{{- if .Values.kwirth.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kwirth.fullname" . }}-crb
  labels:
    {{- include "kwirth.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kwirth.fullname" . }}-cr
subjects:
  - kind: ServiceAccount
    name: {{ include "kwirth.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
