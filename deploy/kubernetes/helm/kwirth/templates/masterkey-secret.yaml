{{- /*
MASTERKEY, in a Secret of its own.

It is apart from the other sensitive variables for one reason: it must OUTLIVE them. It signs the access
keys handed to clients and, with a filesystem store, it derives the key the configuration is encrypted
with — so if it ever changes, every api key stops validating and, on a volume store, the files stop
decrypting. And that failure is silent: the core finds no users it can read and creates the default admin
again, which looks like a fresh install rather than like a lost one.

The PVC, the users Secret and the keys ConfigMap are already kept on uninstall so a reinstall finds them.
A regenerated MASTERKEY would make all three unreadable, so this is kept too, and resolved in the order
the helper describes: what the operator set, then what is already live, then a new random one.

⚠️ 'helm template' has no cluster to look into, so it renders a NEW random key every time. Under a tool
that deploys from rendered output rather than from the cluster (Argo CD and friends), set
kwirth.config.masterkey explicitly, from your own secret manager, or every sync rotates it.
*/ -}}
{{- if not .Values.kwirth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kwirth.masterkeySecretName" . }}
  labels:
    {{- include "kwirth.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  MASTERKEY: {{ include "kwirth.masterkey" . | quote }}
{{- end }}
