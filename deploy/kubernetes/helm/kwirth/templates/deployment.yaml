{{- $store := include "kwirth.store" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kwirth.fullname" . }}
  labels:
    {{- include "kwirth.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.kwirth.replicas }}
  revisionHistoryLimit: {{ .Values.kwirth.revisionHistoryLimit }}
  {{- if .Values.kwirth.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "kwirth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kwirth.selectorLabels" . | nindent 8 }}
        {{- with .Values.kwirth.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.kwirth.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.kwirth.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kwirth.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.kwirth.terminationGracePeriodSeconds }}
      {{- with .Values.kwirth.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.kwirth.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kwirth
          image: {{ include "kwirth.image" . | quote }}
          imagePullPolicy: {{ include "kwirth.imagePullPolicy" . }}
          {{- with .Values.kwirth.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: ROOTPATH
              value: {{ include "kwirth.rootpath" . | quote }}
            - name: PORT
              value: {{ .Values.kwirth.config.port | quote }}
            - name: AUTH
              value: {{ .Values.kwirth.config.auth | quote }}
            - name: CHANNEL_METRICS
              value: {{ .Values.kwirth.config.channelMetrics | quote }}
            - name: CHANNEL_MAGNIFY
              value: {{ .Values.kwirth.config.channelMagnify | quote }}
            - name: METRICSINTERVAL
              value: {{ .Values.kwirth.config.metricsInterval | quote }}
            {{- if .Values.kwirth.config.previousLogLines }}
            - name: PREVIOUSLOGLINES
              value: {{ .Values.kwirth.config.previousLogLines | quote }}
            {{- end }}
            - name: BODYLIMIT
              value: {{ .Values.kwirth.config.bodyLimit | quote }}
            - name: KEEPALIVE
              value: {{ .Values.kwirth.config.keepAlive | quote }}
            - name: FRONT
              value: {{ .Values.kwirth.config.front | quote }}
            - name: ANSILOG
              value: {{ .Values.kwirth.config.ansiLog | quote }}
            - name: EXITLOG
              value: {{ .Values.kwirth.config.exitLog | quote }}
            {{- with .Values.kwirth.config.clusterName }}
            - name: KWIRTH_CLUSTER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- if $store }}
            - name: KWIRTH_STORE
              value: {{ $store | quote }}
            {{- end }}
            {{- if .Values.kwirth.sql.enabled }}
            - name: KWIRTH_SQL_CLIENT
              value: {{ .Values.kwirth.sql.client | quote }}
            - name: KWIRTH_SQL_HOST
              value: {{ .Values.kwirth.sql.host | quote }}
            - name: KWIRTH_SQL_PORT
              value: {{ .Values.kwirth.sql.port | quote }}
            - name: KWIRTH_SQL_USER
              value: {{ .Values.kwirth.sql.user | quote }}
            - name: KWIRTH_SQL_SSL
              value: {{ .Values.kwirth.sql.ssl | quote }}
            - name: KWIRTH_SQL_MAINTDB
              value: {{ .Values.kwirth.sql.maintenanceDb | quote }}
            {{- end }}
            {{- with .Values.kwirth.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "kwirth.envSecretName" . }}
            {{- with .Values.kwirth.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: kwirth
              containerPort: {{ .Values.kwirth.config.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: kwirth
            {{- toYaml .Values.kwirth.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: kwirth
            {{- toYaml .Values.kwirth.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: kwirth
            {{- toYaml .Values.kwirth.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.kwirth.resources | nindent 12 }}
          {{- if or .Values.kwirth.persistence.enabled .Values.kwirth.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.kwirth.persistence.enabled }}
            - name: kwirth-data
              mountPath: {{ .Values.kwirth.persistence.mountPath }}
            {{- end }}
            {{- with .Values.kwirth.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.kwirth.persistence.enabled .Values.kwirth.extraVolumes }}
      volumes:
        {{- if .Values.kwirth.persistence.enabled }}
        - name: kwirth-data
          persistentVolumeClaim:
            claimName: {{ include "kwirth.pvcName" . }}
        {{- end }}
        {{- with .Values.kwirth.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.kwirth.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kwirth.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kwirth.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
