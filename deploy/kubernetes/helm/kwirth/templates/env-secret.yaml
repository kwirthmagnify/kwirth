{{- /*
The sensitive env vars, so that none of them shows up in the pod spec. Skipped when the user brings a Secret
of their own (kwirth.existingSecret).

MASTERKEY is NOT here: it lives in its own Secret because it has to survive an uninstall, and these must
not (a reinstall reusing a stale SQL password would be worse than asking for it again). See
masterkey-secret.yaml.
*/ -}}
{{- if include "kwirth.hasEnvSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kwirth.envSecretName" . }}
  labels:
    {{- include "kwirth.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.kwirth.config.license }}
  KWIRTH_LICENSE: {{ .Values.kwirth.config.license | quote }}
  {{- end }}
  {{- if .Values.kwirth.sql.enabled }}
  KWIRTH_SQL_PASSWORD: {{ .Values.kwirth.sql.password | quote }}
  {{- end }}
{{- end }}
