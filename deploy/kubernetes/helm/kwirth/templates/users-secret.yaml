{{- /*
The users Secret. The core reads 'kwirth-users' in its own namespace, by that exact name, and in Kubernetes it
does NOT create it when missing (the deployment is expected to), so the chart must, and must never overwrite
it afterwards: users are managed from Kwirth.

  - fresh install: rendered with the bootstrap admin.
  - upgrade: the live Secret is looked up and rendered back as it is, so the patch is a no-op and passwords
    survive. Only when it belongs to this release; a Secret nobody owns (the core wrote it, or another
    release did) is left alone and not rendered, which is also what avoids the Helm ownership conflict.
  - uninstall: kept (resource-policy), so a reinstall finds the same users.

'helm template' has no cluster to look into, so it always renders the bootstrap form.
*/ -}}
{{- if .Values.kwirth.users.bootstrap }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "kwirth-users" }}
{{- $owned := include "kwirth.ownedByRelease" (dict "obj" $existing "root" $) }}
{{- if or (not $existing) $owned }}
apiVersion: v1
kind: Secret
metadata:
  name: kwirth-users
  labels:
    {{- include "kwirth.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- if $existing }}
  {{- toYaml (default (dict) $existing.data) | nindent 2 }}
{{- else }}
  admin: {{ .Values.kwirth.users.admin | quote }}
{{- end }}
{{- end }}
{{- end }}
