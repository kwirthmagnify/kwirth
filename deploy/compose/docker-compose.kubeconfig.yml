# Mount a kubeconfig so Kwirth observes a Kubernetes cluster. Layer it on top of the base:
#
#   docker compose -f docker-compose.yml -f docker-compose.kubeconfig.yml up -d
#
# Kwirth is still NOT a pod: restart exits the process and the restart policy brings it back, and the Log
# tab of Status shows the in-memory log. What changes is that channels see the cluster.
#
# A kubeconfig pointing at 127.0.0.1 (kind, k3d, minikube, Docker Desktop) does not work as is: inside the
# container that address is the container itself. Change the server to host.docker.internal — the
# extra_hosts entry below makes that name work on Linux too — or use a copy of the kubeconfig that does.

services:
  kwirth:
    volumes:
      - ${KUBECONFIG_PATH:?KUBECONFIG_PATH is not set. Run install --kubeconfig, or set it in .env}:/root/.kube/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
