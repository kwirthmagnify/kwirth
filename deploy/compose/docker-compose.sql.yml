# PostgreSQL for Kwirth. Layer it on top of the base:
#
#   docker compose -f docker-compose.yml -f docker-compose.sql.yml up -d
#
# Kwirth does not open the connection at startup, only when an extension asks for a database. Each extension
# gets its own database, which Kwirth creates, so the user below needs to be able to create databases — the
# image's superuser is.
#
# Postgres publishes no port: only Kwirth, on the compose network, reaches it.

services:
  postgres:
    image: postgres:${POSTGRES_TAG:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: kwirth
      POSTGRES_PASSWORD: ${KWIRTH_SQL_PASSWORD:?KWIRTH_SQL_PASSWORD is not set. Run install --sql, or set it in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kwirth -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kwirth:
    environment:
      KWIRTH_SQL_HOST: postgres
      KWIRTH_SQL_PORT: "5432"
      KWIRTH_SQL_USER: kwirth
      KWIRTH_SQL_PASSWORD: ${KWIRTH_SQL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
