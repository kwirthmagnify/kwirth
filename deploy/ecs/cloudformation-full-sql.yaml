AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Kwirth on ECS Fargate with PostgreSQL RDS. Same as cloudformation-full.yaml plus a db.t4g.micro
  PostgreSQL instance with 20 GB gp3 storage, and the task definition wired to use it.
  The SQL connection is lazy: Kwirth does not open it at startup, only when an extension asks.

Parameters:
  ImageTag:
    Type: String
    Default: 'develop'
    Description: Tag of kwirthmagnify/kwirth to run. Pin a version; avoid 'latest' outside demos
  ScanRunnerImage:
    Type: String
    Default: ''
    Description: >-
      Optional. Image of the Kwirth scan runner (a container with Trivy). Without Kubernetes there are no
      Jobs to scan images with, so an extension like Excubitor can inventory ECS and Lambda but reports no
      container CVEs. Set this to run the runner as a sidecar and the extension reaches it on
      http://localhost:8080. Leave empty and nothing is deployed.
  VpcCidr:
    Type: String
    Default: '10.0.0.0/16'
    Description: CIDR block for the VPC
  AlbPort:
    Type: Number
    Default: 80
    Description: Port the load balancer listens on (use 443 with a certificate in production)
  AlbIdleTimeout:
    Type: Number
    Default: 3600
    MinValue: 1
    MaxValue: 4000
    Description: >
      Seconds the load balancer keeps an idle connection open (AWS allows up to 4000). A Kwirth session is a
      WebSocket and only speaks when something changes, so the AWS default of 60 cuts it and the browser
      reconnects about once a minute.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: RDS instance class. db.t4g.micro is the smallest Graviton option
  DbAllocatedStorage:
    Type: Number
    Default: 20
    Description: Storage in GB
  DbEngineVersion:
    Type: String
    Default: '15.13'
    Description: PostgreSQL engine version

Conditions:
  # The runner is opt-in: an empty image means the stack behaves exactly as it did before it existed.
  WithScanRunner: !Not [!Equals [!Ref ScanRunnerImage, '']]

Resources:

  # ── VPC and subnets ──────────────────────────────────────────────────────────────────────────────
  # Two public subnets (for the ALB) and two private subnets (for the task, EFS and RDS), across two AZs.

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 12]]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public-1' }]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 12]]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public-2' }]

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 12]]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-private-1' }]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 12]]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-private-2' }]

  # ── Internet gateway and NAT ─────────────────────────────────────────────────────────────────────

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  NatGatewayEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEip.AllocationId
      SubnetId: !Ref PublicSubnet1

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ── Security groups ──────────────────────────────────────────────────────────────────────────────

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP to the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref AlbPort
          ToPort: !Ref AlbPort
          CidrIp: '0.0.0.0/0'

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kwirth task
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3883
          ToPort: 3883
          SourceSecurityGroupId: !GetAtt AlbSecurityGroup.GroupId

  FileSystemSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NFS from the Kwirth task only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !GetAtt TaskSecurityGroup.GroupId

  # RDS: 5432 from the task only. Not from a CIDR, so it keeps working when the task IP changes.
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from the Kwirth task only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt TaskSecurityGroup.GroupId

  # ── Load balancer ────────────────────────────────────────────────────────────────────────────────

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${AWS::StackName}-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !GetAtt AlbSecurityGroup.GroupId
      LoadBalancerAttributes:
        # A Kwirth session is a WebSocket, and a WebSocket is quiet by nature: it only speaks when something
        # changes. The AWS default of 60 s cuts it and the browser reconnects about once a minute.
        # 🔴 This raises the floor, it does not remove the problem: AWS documents no maximum lifetime for
        # these connections, and an ALB replaces its nodes, taking their connections down with a 1006 (no
        # close frame) whatever keep-alive the client sends. Measured here on 2026-10-08: drops at 7, 9, 20
        # and 29 minutes while pings flowed every 20 s. Surviving that is the front end's job, by
        # reconnecting; this only stops the balancer from adding cuts of its own.
        # And it belongs in the template: raised by hand it is lost with the next stack recreation, together
        # with the load balancer itself. That is exactly how it came back to 60.
        - Key: idle_timeout.timeout_seconds
          Value: !Ref AlbIdleTimeout

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: !Ref AlbPort
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: text/plain
            MessageBody: 'No rule matched'

  # ── ECS cluster ──────────────────────────────────────────────────────────────────────────────────

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-cluster'
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  # ── EFS for the store ───────────────────────────────────────────────────────────────────────────

  FileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      FileSystemTags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-store'

  AccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser:
        Uid: '0'
        Gid: '0'
      RootDirectory:
        Path: /kwirth
        CreationInfo:
          OwnerUid: '0'
          OwnerGid: '0'
          Permissions: '0755'

  MountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref PrivateSubnet1
      SecurityGroups:
        - !GetAtt FileSystemSecurityGroup.GroupId

  MountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref PrivateSubnet2
      SecurityGroups:
        - !GetAtt FileSystemSecurityGroup.GroupId

  # ── RDS PostgreSQL ───────────────────────────────────────────────────────────────────────────────
  # Kwirth creates a database per extension (kwirth_<id>) through the maintenance database, so the
  # master user needs CREATEDB. The RDS master user has it by default.

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for Kwirth RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  DbPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'kwirth/${AWS::StackName}-db-password'
      Description: PostgreSQL master password for Kwirth RDS
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true

  DbInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      MasterUsername: kwirth
      # Dynamic reference: CloudFormation reads the secret at deploy time and never logs the value.
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbPasswordSecret}:SecretString}}'
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DbSecurityGroup.GroupId
      BackupRetentionPeriod: 7
      DeletionProtection: false
      DeleteAutomatedBackups: true
      PubliclyAccessible: false

  # ── Target group ─────────────────────────────────────────────────────────────────────────────────

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 3883
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: 'true'
        - Key: stickiness.type
          Value: lb_cookie
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values: ['/*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ── Identity ─────────────────────────────────────────────────────────────────────────────────────

  MasterKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'kwirth/${AWS::StackName}-masterkey'
      Description: >-
        Derives the encryption key for Kwirth secrets at rest. Changing it makes everything already
        written unreadable - there is no migration.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  # Shared secret between the extension and the runner. Generated here so nobody has to invent one and
  # paste it in two places: the runner refuses to start without it and rejects any scan whose bearer
  # token does not match. Read it from Secrets Manager to type it into the extension's settings.
  ScanRunnerTokenSecret:
    Condition: WithScanRunner
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'kwirth/${AWS::StackName}-scan-runner-token'
      Description: Bearer token shared by the scan runner and whoever sends it images to scan.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The MASTERKEY, the DB password and — when the runner is deployed — its token. ECS reads
              # them BEFORE starting the containers: a missing one here does not degrade anything, the
              # task simply never starts.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref MasterKeySecret
                  - !Ref DbPasswordSecret
                  - !If [WithScanRunner, !Ref ScanRunnerTokenSecret, !Ref 'AWS::NoValue']

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: efs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                Resource: !GetAtt FileSystem.Arn
                Condition:
                  StringEquals:
                    elasticfilesystem:AccessPointArn: !GetAtt AccessPoint.Arn
        # Trivy pulls the image it is scanning using the task's own identity. Without this the runner
        # starts, answers its health check and fails every single scan with an ECR error — which reads
        # like a broken runner when it is a missing permission.
        - !If
          - WithScanRunner
          - PolicyName: ecr-read
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # GetAuthorizationToken is account-wide by design: it takes no resource.
                - Effect: Allow
                  Action: ecr:GetAuthorizationToken
                  Resource: '*'
                - Effect: Allow
                  Action:
                    - ecr:BatchCheckLayerAvailability
                    - ecr:GetDownloadUrlForLayer
                    - ecr:BatchGetImage
                    - ecr:DescribeImages
                    - ecr:ListImages
                    - ecr:DescribeRepositories
                  Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/*'
          - !Ref AWS::NoValue

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}-kwirth'
      RetentionInDays: 30

  # ── The task ─────────────────────────────────────────────────────────────────────────────────────

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-kwirth'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      # Trivy shares the task with Kwirth, so the size doubles when the runner is in. Scanning large
      # images is memory-hungry: raise this before lowering the runner's concurrency.
      Cpu: !If [WithScanRunner, '2048', '1024']
      Memory: !If [WithScanRunner, '4096', '2048']
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: kwirth-store
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref AccessPoint
              IAM: ENABLED
        # Ephemeral on purpose: it only holds Trivy's vulnerability database, which is a cache. Losing it
        # on a task replacement costs one download (~3 min), not data.
        - !If
          - WithScanRunner
          - Name: trivy-cache
          - !Ref AWS::NoValue
      ContainerDefinitions:
        - Name: kwirth
          Image: !Sub 'kwirthmagnify/kwirth:${ImageTag}'
          # ECS pins the tag to a digest per deployment by default, so a task restarted by Kwirth's own
          # "Restart Kwirth" (process exit) would run the same image again. Disabled, every task resolves
          # the tag when it starts and a newly pushed image is picked up on restart.
          VersionConsistency: disabled
          Essential: true
          PortMappings:
            - ContainerPort: 3883
              Protocol: tcp
          MountPoints:
            - SourceVolume: kwirth-store
              ContainerPath: /data/kwirth
              ReadOnly: false
          Environment:
            - Name: KWIRTH_STORE
              Value: /data/kwirth
            - Name: KWIRTH_CLUSTER_NAME
              Value: !Ref AWS::StackName
            # SQL connection. Lazy: Kwirth does not connect at startup, only when an extension
            # asks for its database. If RDS is unreachable Kwirth still starts; the extension
            # that needed it is the one that fails.
            - Name: KWIRTH_SQL_HOST
              Value: !GetAtt DbInstance.Endpoint.Address
            - Name: KWIRTH_SQL_PORT
              Value: '5432'
            - Name: KWIRTH_SQL_USER
              Value: kwirth
            - Name: KWIRTH_SQL_SSL
              Value: 'true'
          Secrets:
            - Name: MASTERKEY
              ValueFrom: !Ref MasterKeySecret
            - Name: KWIRTH_SQL_PASSWORD
              ValueFrom: !Ref DbPasswordSecret
          HealthCheck:
            Command:
              - CMD-SHELL
              - wget -q -O - http://localhost:3883/healthz || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: kwirth

        # ── The scan runner, when asked for ────────────────────────────────────────────────────────
        - !If
          - WithScanRunner
          - Name: scan-runner
            Image: !Ref ScanRunnerImage
            # NOT essential: if the runner dies, Kwirth stays up. You lose new image CVEs, not the product.
            Essential: false
            PortMappings:
              # Not published through the load balancer: the only client is Kwirth, over localhost, and the
              # bearer token is the runner's only protection.
              - ContainerPort: 8080
                Protocol: tcp
            Environment:
              - Name: PORT
                Value: '8080'
              - Name: MAX_CONCURRENCY
                Value: '1'
              - Name: TRIVY_CACHE_DIR
                Value: /trivy-cache
            Secrets:
              - Name: SCAN_RUNNER_TOKEN
                ValueFrom: !Ref ScanRunnerTokenSecret
            MountPoints:
              - SourceVolume: trivy-cache
                ContainerPath: /trivy-cache
                ReadOnly: false
            HealthCheck:
              Command:
                - CMD-SHELL
                - wget -q -O - http://localhost:8080/healthz || exit 1
              Interval: 30
              Timeout: 5
              Retries: 3
              # The first start downloads the vulnerability database (around 3 minutes). A shorter grace
              # period kills the container halfway through it, over and over.
              StartPeriod: 300
            LogConfiguration:
              LogDriver: awslogs
              Options:
                awslogs-group: !Ref LogGroup
                awslogs-region: !Ref AWS::Region
                awslogs-stream-prefix: scan-runner
          - !Ref AWS::NoValue

  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !GetAtt TaskSecurityGroup.GroupId
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: kwirth
          ContainerPort: 3883
          TargetGroupArn: !Ref TargetGroup

Outputs:
  LoadBalancerDns:
    Description: URL where Kwirth is reachable
    Value: !Sub 'http://${LoadBalancer.DNSName}:${AlbPort}'
  FileSystemId:
    Description: EFS holding the Kwirth store
    Value: !Ref FileSystem
  MasterKeySecretArn:
    Description: Generated MASTERKEY. Do not change it once Kwirth has written secrets.
    Value: !Ref MasterKeySecret
  DbPasswordSecretArn:
    Description: PostgreSQL master password
    Value: !Ref DbPasswordSecret
  DbEndpoint:
    Description: RDS endpoint address
    Value: !GetAtt DbInstance.Endpoint.Address
  EcsClusterName:
    Description: ECS cluster running Kwirth
    Value: !Ref EcsCluster
